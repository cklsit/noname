name: Deploy Web to GitHub Pages

# 用途：把《无名杀》网页版（apps/core 的 Vite 产物 dist/）发布到 GitHub Pages 项目站点
#       https://cklsit.github.io/noname/
#
# 为什么不用 GitHub 的 “Deploy from a branch” 模式：
#   仓库现有 build.yml 走的是「把 dist 推到 build-output 分支」的老办法，那要求仓库里
#   常驻一份 1.3GB 的构建产物；而且该分支若被设为 Pages 源，单站点发布上限 1GB 依然会挡住。
#   本工作流改用 GitHub Actions 作为发布源（build_type=workflow）：产物只作为本次运行的
#   artifact 上传，不落任何分支，干净且可回溯。
#
# 为什么必须裁剪 dist（硬约束）：
#   pnpm build 全量产出 ≈ 1.3 GiB / 15593 个文件，而 GitHub Pages 单站点发布上限是 1 GB，
#   全量上传必然失败。因此必须删除一部分资源把体积压到 1 GB 以下。
#   被删除的（纯音频，均有内置兜底，且网页版可接受缺省）：
#     dist/audio/skill  470 MiB  武将技能语音（整目录 mp3）
#     dist/audio/die    111 MiB  阵亡语音（整目录 mp3）
#   裁剪后 ≈ 750 MiB，稳定低于 1 GB 限制。
#
# 为什么保留 dist/image/character（不可裁）：
#   iOS 工作流之所以敢删立绘，是因为移动端实现了「边玩边下」（apps/mobile/src/lazy-assets.ts）。
#   但**网页版没有这套按需补齐机制** —— 一旦删掉武将立绘（390 MiB），页面上就会大面积破图。
#   所以这里只删音频、绝不碰 image/character。
#
# 为什么删完必须重建 asset-manifest.json：
#   运行时通过读取 dist/asset-manifest.json 来枚举资源；该清单是构建时按全量文件生成的。
#   删文件后若不重建，清单里仍列着已删除的 skill/die 音频，运行时就会去请求不存在的文件
#   （控制台刷 404、音效播放失败）。因此裁剪之后必须扫描现有文件、重写清单。
#
# 为什么首版只允许手动触发：
#   这是新引入的发布链路，先手动跑通、确认站点可访问、体积达标，再谈自动化。
#   待验证稳定后，取消下方 push 配置的注释即可实现 main 更新后自动部署。
#
# 触发方式：GitHub 网页 → Actions → “Deploy Web to GitHub Pages” → Run workflow
# 站点地址：https://cklsit.github.io/noname/

on:
  # 首版仅手动触发（见顶部说明）
  workflow_dispatch:

  # 如需 main 分支更新后自动部署，取消下面三行的注释即可：
  # push:
  #   branches: [main]

# Pages 发布所需的最小权限集：
#   contents: read   仅读取仓库源码，不需要写（本流程不推送任何分支）
#   pages: write     调用 Pages 发布 API 所必需
#   id-token: write  deploy-pages 通过 OIDC 令牌向 Pages 服务验证身份，必需
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一时刻只允许一个 Pages 发布在跑。
#   cancel-in-progress: false —— 不打断正在进行的发布，避免把站点停在半截状态；
#   新的运行会排队等待，保证线上始终是「一次完整部署」的结果。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # job 1：构建 + 裁剪 + 产出 Pages artifact
  build:
    name: Build & Trim
    runs-on: ubuntu-latest
    # 实测整个构建约 3 分钟；给 30 分钟上限，足以覆盖冷缓存安装 + 裁剪开销。
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets (dist/)
        env:
          NONAME_BUILD_CHANNEL: test
          NONAME_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Trim dist & rebuild asset manifest
        run: |
          DIST=dist

          echo "===== 裁剪前 ====="
          du -sh "$DIST"
          du -sh "$DIST"/* | sort -rh | head -10

          # 只删纯音频目录（详见文件顶部注释）：
          #   audio/skill 470M / audio/die 111M，目录内全是 mp3，删除后不影响可玩性。
          # 注意：**不要**动 image/character —— 网页版无「边玩边下」，删了会破图。
          rm -rf "$DIST/audio/skill"
          rm -rf "$DIST/audio/die"

          echo "===== 裁剪后 ====="
          du -sh "$DIST"
          du -sh "$DIST"/* | sort -rh | head -10

          # 资源集合已变，asset-manifest.json 必须重建，否则运行时会尝试访问已删除的文件。
          # 下面的实现与仓库现有 iOS 工作流保持一致（逐文件走目录树、排序后写回）。
          rebuild_manifest() {
            ROOT="$1" node -e "
          const fs=require('fs'),path=require('path');
          const root=process.env.ROOT, out=path.resolve(root,'asset-manifest.json');
          const ignored=new Set(['asset-manifest.json','preload.js','node_modules']);
          const entries=[];
          (function walk(dir){
            for(const name of fs.readdirSync(dir)){
              if(ignored.has(name)) continue;
              const abs=path.join(dir,name);
              if(fs.statSync(abs).isDirectory()){ walk(abs); continue; }
              entries.push(path.relative(root,abs).split(path.sep).join('/'));
            }
          })(root);
          entries.sort();
          fs.writeFileSync(out, JSON.stringify(entries)+'\n');
          console.log(root + ' asset-manifest.json: ' + entries.length + ' entries');
          "
          }

          rebuild_manifest "$DIST"

          # 体积兜底校验：GitHub Pages 单站点上限 1 GB，一旦超限上传会在后续步骤失败。
          # 这里提前用字节数判断并给出明确报错，避免排查时误怪到 upload/deploy 步骤头上。
          SIZE_BYTES=$(du -sb "$DIST" | cut -f1)
          echo "dist 字节数: $SIZE_BYTES"
          if [ "$SIZE_BYTES" -ge 1000000000 ]; then
            echo "::error::裁剪后 dist 仍 ≥ 1 GB（${SIZE_BYTES} 字节），超过 GitHub Pages 单站点上限。"
            echo "请在本步骤再补充需要删除的资源目录后重试。"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # job 2：把 artifact 发布到 GitHub Pages（Actions 发布源）
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
