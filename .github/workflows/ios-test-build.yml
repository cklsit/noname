name: Build test iOS IPA

on:
  push:
    branches:
      - feat/ios-integration
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish the built IPA to the Nightly Release
        type: boolean
        required: false
        default: false
      deploy_to_ipad:
        description: Deploy the built IPA through the LAN iPad runner
        type: boolean
        required: false
        default: false
      ipad_device_id:
        description: Optional pairing UDID for the target iPad
        type: string
        required: false
        default: ""
      ipad_host:
        description: Optional SideStore endpoint host; Bonjour discovery is used when empty
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ios-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA (slim assets)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      NONAME_BUILD_CHANNEL: ${{ inputs.publish_nightly && 'nightly' || 'test' }}
      NONAME_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build noname
        run: pnpm build

      - name: Verify iOS Capacitor project
        run: test -f apps/mobile/ios/App/App.xcodeproj/project.pbxproj

      - name: Capacitor sync
        working-directory: apps/mobile
        run: pnpm sync:ios

      - name: Strip character art and voice
        working-directory: apps/mobile
        run: pnpm exec tsx ios/strip-assets.ts

      - name: Free disk
        run: rm -rf dist

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build unsigned iOS app
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            EXCLUDED_ARCHS="i386 x86_64" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            -quiet \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          IPA_NAME="noname-ios-unsigned"
          BUILD_DIR="$RUNNER_TEMP/ipa-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/Payload"
          cp -r "$APP_PATH" "$BUILD_DIR/Payload/"

          find "$BUILD_DIR/Payload" -name "._*" -delete || true

          cd "$BUILD_DIR"
          zip -qry "$IPA_NAME.ipa" Payload -x '*.DS_Store' -x '*/._*'

          shasum -a 256 "$IPA_NAME.ipa" > "$IPA_NAME.ipa.sha256"

          echo "ipa_path=$BUILD_DIR/$IPA_NAME.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload test IPA
        uses: actions/upload-artifact@v4
        with:
          name: noname-ios-unsigned
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.ipa_path }}.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish Nightly Release
        if: inputs.publish_nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/nightly-release-notes.md"
          build_time="$(TZ=Asia/Shanghai date "+%Y-%m-%dT%H:%M:%S%z")"
          {
            echo "Automated iOS nightly build from \`${SOURCE_SHA}\`."
            echo
            echo "- Build time: ${build_time}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Download: \`noname-ios-unsigned.ipa\`"
            echo "- Integrity: verify with \`noname-ios-unsigned.ipa.sha256\`"
          } > "$notes_file"

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --target "$SOURCE_SHA" \
              --title "Nightly Release" \
              --prerelease \
              --notes-file "$notes_file"
          else
            gh release create nightly \
              --target "$SOURCE_SHA" \
              --title "Nightly Release" \
              --prerelease \
              --notes-file "$notes_file"
          fi

          gh release upload nightly \
            "$IPA_PATH" \
            "$IPA_PATH.sha256" \
            --clobber

  deploy-ios:
    name: Deploy unsigned IPA through built-in SideStore
    needs: build-ios
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_ipad) ||
      (github.event_name == 'push' && vars.NONAME_AUTO_DEPLOY == 'true')
    runs-on: [self-hosted, Linux, noname-ios-deploy]
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    env:
      HTTP_PROXY: ${{ secrets.NONAME_HTTPS_PROXY }}
      HTTPS_PROXY: ${{ secrets.NONAME_HTTPS_PROXY }}

    steps:
      - name: Deploy through LiveContainer built-in SideStore
        uses: cklsit/LiveContainer/.github/actions/noname-ios-deploy@2177b69de6c962bdc6a84181ead68dd77773d308
        with:
          artifact-run-id: ${{ github.run_id }}
          device-id: ${{ inputs.ipad_device_id || secrets.NONAME_IOS_DEVICE_ID }}
          host: ${{ inputs.ipad_host || secrets.NONAME_IOS_HOST }}

      - name: Delete successful deployment artifact
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api_root = "https://api.github.com"
          repository = os.environ["ARTIFACT_REPOSITORY"]
          run_id = os.environ["ARTIFACT_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "noname-ios-artifact-cleanup",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(path: str, method: str = "GET"):
              req = urllib.request.Request(api_root + path, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response) if method == "GET" else None

          artifacts = []
          page = 1
          while True:
              payload = request(
                  f"/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100&page={page}"
              )
              batch = payload.get("artifacts", [])
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          matches = [
              artifact
              for artifact in artifacts
              if artifact.get("name") == "noname-ios-unsigned"
              and not artifact.get("expired")
          ]
          for artifact in matches:
              request(f"/repos/{repository}/actions/artifacts/{artifact['id']}", "DELETE")
              print(f"Deleted artifact {artifact['id']}")
          if not matches:
              print("Deployment artifact was already absent")
          PY
