name: Deploy nightly IPA to iPad

# 只跑部署、不重新构建：从 nightly Release 下载现成的 IPA，
# 通过局域网 runner 推到 iPad。用于验证部署链路或重试夜间部署。

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that holds the IPA
        type: string
        required: true
        default: nightly

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-nightly-ipad
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy nightly IPA to iPad
    runs-on: [self-hosted, Linux, noname-ios-deploy]
    timeout-minutes: 45
    env:
      HTTP_PROXY: ${{ secrets.NONAME_HTTPS_PROXY }}
      HTTPS_PROXY: ${{ secrets.NONAME_HTTPS_PROXY }}
      NONAME_IOS_PASSCODE: ${{ secrets.NONAME_IOS_PASSCODE }}
      NONAME_LOCK_DURING_DEPLOY: "1"
      NONAME_KEEP_AWAKE: "1"
      NONAME_MAX_RECOVERIES: "2"
      NONAME_ALIVE_TIMEOUT: "2"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download nightly IPA
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          "${NONAME_DEPLOY_PYTHON:-python3}" - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          repository = os.environ["GH_REPO"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "noname-deploy-only",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def fetch(url: str) -> bytes:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=120) as response:
                  return response.read()

          release = json.loads(fetch(f"https://api.github.com/repos/{repository}/releases/tags/{tag}"))
          asset = next((item for item in release.get("assets", []) if item["name"].endswith(".ipa")), None)
          if asset is None:
              raise SystemExit(f"no IPA asset on the {tag} release")

          target = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "nightly" / asset["name"]
          target.parent.mkdir(parents=True, exist_ok=True)
          download_headers = dict(headers)
          download_headers["Accept"] = "application/octet-stream"
          request = urllib.request.Request(asset["url"], headers=download_headers)
          with urllib.request.urlopen(request, timeout=600) as response, target.open("wb") as handle:
              while chunk := response.read(1024 * 1024):
                  handle.write(chunk)

          print(f"downloaded {target} ({target.stat().st_size} bytes)")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"NONAME_IPA_PATH={target}\n")
          PY

      - name: Deploy through LiveContainer built-in SideStore
        uses: cklsit/LiveContainer/.github/actions/noname-ios-deploy@2dff00df23c44d8511a576e80d10143f295864a5
        with:
          ipa-path: ${{ env.NONAME_IPA_PATH }}
          device-id: ${{ secrets.NONAME_IOS_DEVICE_ID }}
          host: ${{ secrets.NONAME_IOS_HOST }}

      - name: Record result
        if: always()
        shell: bash
        run: |
          {
            echo "## iPad deployment ${{ job.status }}"
            echo ""
            echo "This run reused the IPA from the \`${{ inputs.release_tag }}\` release."
            echo "The installer removes the existing app container before reinstalling."
          } >> "$GITHUB_STEP_SUMMARY"
