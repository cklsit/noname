name: Build and Deploy

# ⚠️ 本 workflow 会把整个 dist 强推到 build-output 分支：实测 15,757 个文件、
# 约 1.27 GB（其中音频 621 MB、图片 531 MB）。原先它挂在 push: main 上，
# 也就是**每次合并进 main 都产生一个 1.27 GB 的新提交**，仓库 .git 因此膨胀到
# 2.5 GiB 量级（git count-objects -vH 实测），clone 与 CI 检出都受影响。
#
# 网页版发布已由 cloudflare-pages.yml 接管，这个分支不再承担发布职责，
# 因此改为仅手动触发：能力保留，但不再自动跑、不再给仓库增重。
# 如果确认无人再使用 build-output 分支，可以直接删除整个 workflow，
# 并用 git filter-repo 清理历史中的大对象。
on:
  workflow_dispatch:

permissions:
  contents: write  # 允许 Actions 推送代码到仓库

# 工具链版本集中定义，避免各步骤/各 workflow 之间漂移。
env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

# 并发控制：同一时间只保留最新一次构建，避免两个任务并发强推同一个分支。
# 旧运行还在 checkout / install 阶段就被新运行取代，直接取消，避免排队占满 runner。
concurrency:
  group: build-output
  cancel-in-progress: true

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          # 仓库有 7 份 pnpm-lock.yaml（sharedWorkspaceLockfile: false），
          # 不指定 cache-dependency-path 时缓存键只跟根 lockfile 挂钩：
          # 改了子包 lockfile 不会让缓存失效，会出现假命中。
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        # --ignore-scripts：本 job 只做网页构建（pnpm build 只需要 noname 与 extension）。
        #   跳过 electron 的 postinstall（下载 ~100MB 二进制）等与本 job 无关的重活；
        #   esbuild 的平台二进制来自 optionalDependencies，不依赖 postinstall（ios-build.yml 已验证）。
        # --prefer-offline：优先命中 setup-node 恢复的 pnpm store，省掉远端元数据往返；
        #   与 --frozen-lockfile 同用时版本仍严格由 lockfile 决定，不引入漂移。
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Run Build
        env:
          NONAME_BUILD_CHANNEL: test
          NONAME_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Deploy dist to branch
        run: |
          mkdir /tmp/dist
          # 用 dist/. 而不是 dist/*：后者不匹配点文件，会丢掉 dist/.nomedia
          # （Android 相册会因此去索引游戏资源图）。
          cp -a dist/. /tmp/dist/

          # 不执行 git fetch：本仓库历史体积很大（工作树 1.25GB，.git 2.6GB），
          # 而这里只是把 dist 推成 build-output 这个孤儿分支，不需要任何远端历史。
          # checkout 已经把带凭据的 origin 配好，直接 push 即可。
          git checkout --orphan build-output
          git reset --hard
          rm -rf *

          cp -a /tmp/dist/. .

          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Deploy dist from $GITHUB_SHA"
          git push -f origin build-output
