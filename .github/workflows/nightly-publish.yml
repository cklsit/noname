name: Nightly Publish

on:
  schedule:
    - cron: '11 13 * * *' # 每天的 21:11 运行
  workflow_dispatch: # 允许手动点击按钮触发编译

permissions:
  contents: write  # 允许 Actions 推送代码到仓库

# 并发控制：定时任务与手动触发叠在一起时只跑最新的一次（夜间快照，新的取代旧的）。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  publish:
    name: Nightly Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        # 本 job 只做网页构建 + 打测试包（generateTestPack 内部就是 pnpm build），
        # 不需要 electron 等 postinstall 重活。
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Resolve Nightly Metadata
        id: info
        shell: bash
        run: |
          BUILD_TIME="$(TZ=Asia/Shanghai date --iso-8601=seconds)"
          BUILD_DATE="${BUILD_TIME%%T*}"
          echo "NONAME_BUILD_CHANNEL=nightly" >> "$GITHUB_ENV"
          echo "NONAME_BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "NONAME_BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          echo "date=${BUILD_DATE//-/}" >> "$GITHUB_OUTPUT"

      - name: Build and Generate test pack
        run: pnpm generateTestPack

      - name: Upload Nightly Artifact
        uses: actions/upload-artifact@v7
        with:
          name: 测试包-${{ steps.info.outputs.date }}
          path: output/testpack
          retention-days: 7
