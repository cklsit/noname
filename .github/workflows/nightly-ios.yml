name: Nightly iOS release and LAN deployment

on:
  schedule:
    # UTC 17:00 = 01:00 Asia/Shanghai. The build checks out the upstream branch
    # directly, so a late or failed sync no longer blocks the nightly run.
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-sync:
    name: Resolve upstream feat/ios-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.verify.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: feat/ios-integration
      UPSTREAM_OWNER: libnoname
      UPSTREAM_REPO: noname
    steps:
      - name: Resolve upstream head
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          # Build exactly what upstream has right now. Resolving the SHA from
          # libnoname/noname avoids depending on the 00:00 mirror job: upstream
          # moves during the day, and a stale or diverged fork branch used to
          # abort the whole nightly run.
          source_sha="$(gh api "repos/${UPSTREAM_OWNER}/${UPSTREAM_REPO}/git/ref/heads/${BRANCH}" --jq '.object.sha')"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the head of ${UPSTREAM_OWNER}/${UPSTREAM_REPO}:${BRANCH}"
            exit 1
          fi
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          {
            echo "## Nightly source"
            echo ""
            echo "- Upstream: \`${UPSTREAM_OWNER}/${UPSTREAM_REPO}:${BRANCH}\`"
            echo "- Commit: \`${source_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-ios:
    name: Build unsigned iOS IPA
    needs: verify-sync
    runs-on: macos-26
    outputs:
      artifact_name: ${{ steps.package.outputs.ipa_name }}
      ipa_version: ${{ steps.package.outputs.ipa_version }}
    timeout-minutes: 90
    env:
      NONAME_BUILD_CHANNEL: nightly
      NONAME_BUILD_COMMIT: ${{ needs.verify-sync.outputs.source_sha }}

    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v6
        with:
          repository: libnoname/noname
          ref: ${{ needs.verify-sync.outputs.source_sha }}
          token: ${{ github.token }}
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build noname
        run: pnpm build

      - name: Verify iOS Capacitor project
        run: test -f apps/mobile/native/ios/App/App.xcodeproj/project.pbxproj

      - name: Capacitor sync
        working-directory: apps/mobile
        run: pnpm sync:ios

      - name: Strip character art and voice
        working-directory: apps/mobile
        run: pnpm exec tsx scripts/strip-ios-assets.ts

      - name: Free disk
        run: rm -rf dist

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/native/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build unsigned iOS app
        working-directory: apps/mobile/native/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            EXCLUDED_ARCHS="i386 x86_64" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            CURRENT_PROJECT_VERSION="$(date -u +%Y%m%d%H%M%S)" \
            -quiet \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          IPA_NAME="noname-ios-nightly-${NONAME_BUILD_COMMIT:0:8}"
          BUILD_DIR="$RUNNER_TEMP/ipa-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/Payload"
          cp -r "$APP_PATH" "$BUILD_DIR/Payload/"
          IPA_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          if [[ ! "$IPA_VERSION" =~ ^[0-9]{14}$ ]]; then
            echo "::error::Unexpected CFBundleVersion '${IPA_VERSION}'; nightly builds need a unique build number"
            exit 1
          fi
          echo "ipa_version=${IPA_VERSION}" >> "$GITHUB_OUTPUT"
          find "$BUILD_DIR/Payload" -name "._*" -delete || true
          cd "$BUILD_DIR"
          zip -qry "$IPA_NAME.ipa" Payload -x '*.DS_Store' -x '*/._*'
          shasum -a 256 "$IPA_NAME.ipa" > "$IPA_NAME.ipa.sha256"
          echo "ipa_path=$BUILD_DIR/$IPA_NAME.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa_name }}
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.ipa_path }}.sha256
          retention-days: 14
          if-no-files-found: error

  publish-nightly:
    name: Publish Nightly Release
    needs:
      - verify-sync
      - build-ios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-ios.outputs.artifact_name }}
          path: nightly

      - name: Update tag, notes, and IPA assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 该作业没有 actions/checkout，gh release 默认要从本地 git 仓库推断仓库名，
          # 没有 GH_REPO 时会直接报 "fatal: not a git repository"。
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.verify-sync.outputs.source_sha }}
          # 标签必须指向本仓库存在的提交；构建提交来自上游仓库，不一定在本仓库对象库里。
          TAG_SHA: ${{ github.sha }}
          ARTIFACT_NAME: ${{ needs.build-ios.outputs.artifact_name }}
          IPA_VERSION: ${{ needs.build-ios.outputs.ipa_version }}
          BRANCH: feat/ios-integration
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_SHA:-}" ]]; then
            SOURCE_SHA="$(gh api "repos/libnoname/noname/git/ref/heads/${BRANCH:-feat/ios-integration}" --jq '.object.sha')"
          fi
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source SHA is unavailable"; exit 1; }
          [[ "$TAG_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tag SHA is unavailable"; exit 1; }
          ipa_path="$(find nightly -maxdepth 2 -type f -name '*.ipa' -print -quit)"
          sha_path="${ipa_path}.sha256"
          [[ -n "$ipa_path" && -f "$ipa_path" && -f "$sha_path" ]]
          ipa_file="$(basename "$ipa_path")"
          sha_file="${ipa_file}.sha256"

          notes_file="$RUNNER_TEMP/nightly-notes.md"
          {
            echo "Automated iOS nightly build from \`${SOURCE_SHA}\`."
            echo
            echo "- Build time: $(TZ=Asia/Shanghai date "+%Y-%m-%dT%H:%M:%S%z")"
            echo "- Build version: \`${IPA_VERSION}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Download: \`${ipa_file}\`"
            echo "- Integrity: verify with \`${sha_file}\`"
            echo "- Deployment deletes the existing app container before reinstalling."
          } > "$notes_file"

          has_tag=false
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="$TAG_SHA" \
              -F force=true
            has_tag=true
          fi

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Nightly Release" \
              --prerelease \
              --notes-file "$notes_file"
          elif [[ "$has_tag" == "true" ]]; then
            gh release create nightly \
              --verify-tag \
              --title "Nightly Release" \
              --prerelease \
              --notes-file "$notes_file"
          else
            gh release create nightly \
              --target "$TAG_SHA" \
              --title "Nightly Release" \
              --prerelease \
              --notes-file "$notes_file"
          fi

          gh release upload nightly "$ipa_path" "$sha_path" --clobber
          while IFS= read -r asset; do
            case "$asset" in
              *.ipa|*.ipa.sha256)
                if [[ "$asset" != "$ipa_file" && "$asset" != "$sha_file" ]]; then
                  gh release delete-asset nightly "$asset" --yes
                fi
                ;;
            esac
          done < <(gh release view nightly --json assets --jq '.assets[].name')

  deploy-ios:
    name: Deploy Nightly IPA to iPad
    needs:
      - build-ios
      - publish-nightly
      - verify-sync
    if: success()
    runs-on: [self-hosted, Linux, noname-ios-deploy]
    timeout-minutes: 45
    permissions:
      actions: write
      contents: read
    env:
      HTTP_PROXY: ${{ secrets.NONAME_HTTPS_PROXY }}
      HTTPS_PROXY: ${{ secrets.NONAME_HTTPS_PROXY }}
      NONAME_IOS_PASSCODE: ${{ secrets.NONAME_IOS_PASSCODE }}
      NONAME_LOCK_DURING_DEPLOY: "1"
      NONAME_KEEP_AWAKE: "1"
      NONAME_MAX_RECOVERIES: "2"
      NONAME_ALIVE_TIMEOUT: "2"
    steps:
      - name: Deploy through LiveContainer built-in SideStore
        uses: cklsit/LiveContainer/.github/actions/noname-ios-deploy@2115284f97f0a146b1a15e1efc18ff64c1f4353a
        with:
          artifact-run-id: ${{ github.run_id }}
          artifact-name: ${{ needs.build-ios.outputs.artifact_name }}
          device-id: ${{ secrets.NONAME_IOS_DEVICE_ID }}
          host: ${{ secrets.NONAME_IOS_HOST }}

      - name: Record data-reset warning
        if: success()
        shell: bash
        run: |
          {
            echo "## iPad deployment completed"
            echo ""
            echo "Flow: the installer unlocked the passcode-protected device, started the silent-audio background task, and locked the display once the job reached the install stage."
            echo ""
            echo "While the screen is off the runner probes \`GET /v1/hello\` every two seconds. If the endpoint stops answering (iOS suspended the host), or the job reports \`failed\` while the display is locked (installd refused the install), the runner wakes the iPad, unlocks it with the configured passcode, relaunches the host with a fresh token, and resumes the deployment. At most \`NONAME_MAX_RECOVERIES\` (2) wake-and-retry cycles are allowed; an interrupted install is only redone when the installed build number differs from the IPA."
            echo ""
            echo "The device is locked again at the end of the run so it stays on its screen-off schedule."
            echo ""
            echo "The nightly installer fully removes the existing app and its container before reinstalling."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete successful deployment artifact
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build-ios.outputs.artifact_name }}
          ARTIFACT_REPOSITORY: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          api_root = "https://api.github.com"
          repository = os.environ["ARTIFACT_REPOSITORY"]
          run_id = os.environ["ARTIFACT_RUN_ID"]
          artifact_name = os.environ["ARTIFACT_NAME"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "noname-nightly-cleanup",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          request = urllib.request.Request(
              f"{api_root}/repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              artifacts = json.load(response).get("artifacts", [])

          matches = [
              artifact for artifact in artifacts
              if artifact.get("name") == artifact_name and not artifact.get("expired")
          ]
          for artifact in matches:
              delete = urllib.request.Request(
                  f"{api_root}/repos/{repository}/actions/artifacts/{artifact['id']}",
                  headers=headers,
                  method="DELETE",
              )
              with urllib.request.urlopen(delete, timeout=60):
                  pass
              print(f"Deleted artifact {artifact['id']}")
          if not matches:
              print("Deployment artifact was already absent")
          PY
