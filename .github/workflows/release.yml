name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve release metadata
        id: release-metadata
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+([.][0-9]+)*$ ]]; then
            echo "Tag $TAG is not a numeric release tag." >&2
            exit 1
          fi

          # 只需要「标签名」做比较，用 ls-remote 直接读远端标签，不下载标签对象。
          # 原先的 `git fetch --force --tags` 会把每个标签对应的提交连同其巨大树对象
          # 一起拉下来（本仓库工作树 1.25GB / .git 2.6GB），对判断最新版本毫无必要。
          LATEST_TAG="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+([.][0-9]+){2,}$' | sort -V | tail -n 1)"
          if [[ "$TAG" == "$LATEST_TAG" ]]; then
            IS_LATEST_RELEASE=true
          else
            IS_LATEST_RELEASE=false
          fi
          echo "is_latest_release=$IS_LATEST_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_LATEST_RELEASE: ${{ steps['release-metadata'].outputs.is_latest_release }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          RELEASE_ARGS=(
            --title "$TAG"
            --notes-file apps/core/game/updateLog.md
            --draft
          )

          if [[ "$IS_LATEST_RELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--latest)
          else
            RELEASE_ARGS+=(--latest=false)
          fi

          gh release create "$TAG" "${RELEASE_ARGS[@]}"

  build-core:
    name: Build Core
    needs: create-release
    runs-on: ubuntu-latest
    env:
      NONAME_BUILD_CHANNEL: release
      NONAME_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        # 本 job 只做网页构建与 7z 打包，不需要 electron 等 postinstall 重活。
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build core and full packages
        shell: bash
        run: |
          mkdir -p release
          pnpm build

          cd apps/core/dist
          7z a ../../../release/noname.core.zip *

          cd ../../../dist
          7z a ../release/noname.full.zip *

          cd ../release
          7z t noname.core.zip
          7z t noname.full.zip
          sha256sum noname.core.zip > noname.core.zip.sha256
          sha256sum noname.full.zip > noname.full.zip.sha256

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release upload "$TAG" \
          release/noname.core.zip \
          release/noname.core.zip.sha256 \
          release/noname.full.zip \
          release/noname.full.zip.sha256 \
          --clobber

  build-windows:
    name: Build Windows
    needs: create-release
    runs-on: windows-latest
    env:
      NONAME_BUILD_CHANNEL: release
      NONAME_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        # 本 job 要出 Electron 安装包，必须保留 postinstall（electron 二进制由它下载），
        # 仅加 --prefer-offline：优先命中 setup-node 恢复的 pnpm store。
        # （同一条 workflow 缓存也会被下面 build-android 复用，无需重复下载。）
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prepare version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Build Windows installer
        shell: bash
        run: |
          mkdir -p release
          pnpm build

          pnpm -F @noname/electron build:win
          EXE="$(find output -maxdepth 1 -name '*.exe' | head -n 1)"
          cp "$EXE" "release/noname.Setup.${VER}.exe"
          sha256sum "release/noname.Setup.${VER}.exe" > "release/noname.Setup.${VER}.exe.sha256"

      - name: Upload installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release upload "$TAG" \
          "release/noname.Setup.${VER}.exe" \
          "release/noname.Setup.${VER}.exe.sha256" \
          --clobber

  build-android:
    name: Build Android
    needs: create-release
    runs-on: ubuntu-latest
    env:
      NONAME_BUILD_CHANNEL: release
      NONAME_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Make Gradle wrapper executable
        run: chmod +x apps/mobile/native/android/gradlew

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        # Android 构建不需要 electron 的 postinstall 重活。
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Prepare Android signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing GitHub Secret ANDROID_KEYSTORE_BASE64}"
          SIGNING_DIR="$RUNNER_TEMP/noname-android-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/noname-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$SIGNING_DIR/noname-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Android APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release
          pnpm -F @noname/mobile build:android
          cp apps/mobile/native/android/app/build/outputs/apk/release/app-release.apk release/noname.android.apk
          sha256sum release/noname.android.apk > release/noname.android.apk.sha256

      - name: Upload Android packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" \
            release/noname.android.apk \
            release/noname.android.apk.sha256 \
            --clobber

  build-ios:
    name: Build iOS
    needs: create-release
    runs-on: macos-26
    timeout-minutes: 90
    env:
      NONAME_BUILD_CHANNEL: release
      NONAME_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository (shallow)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build noname
        run: pnpm build

      - name: Verify iOS Capacitor project
        run: test -f apps/mobile/native/ios/App/App.xcodeproj/project.pbxproj

      - name: Capacitor sync
        working-directory: apps/mobile
        run: pnpm sync:ios

      - name: Strip character art and voice
        working-directory: apps/mobile
        run: pnpm exec tsx scripts/strip-ios-assets.ts

      - name: Free disk
        run: rm -rf dist

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/native/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build unsigned iOS app
        working-directory: apps/mobile/native/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            EXCLUDED_ARCHS="i386 x86_64" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            COPY_PHASE_STRIP=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            -quiet \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/App.app"
          IPA_NAME="noname.ios.experimental"
          BUILD_DIR="$RUNNER_TEMP/ipa-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/Payload"
          cp -r "$APP_PATH" "$BUILD_DIR/Payload/"

          find "$BUILD_DIR/Payload" -name "._*" -delete || true

          cd "$BUILD_DIR"
          zip -qry "$IPA_NAME.ipa" Payload -x '*.DS_Store' -x '*/._*'

          shasum -a 256 "$IPA_NAME.ipa" > "$IPA_NAME.ipa.sha256"

          echo "ipa_path=$BUILD_DIR/$IPA_NAME.ipa" >> "$GITHUB_OUTPUT"

      - name: Upload iOS package to release
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$IPA_PATH" \
            "$IPA_PATH.sha256" \
            --clobber

  release:
    name: Release Version
    runs-on: ubuntu-latest
    needs:
      - build-core
      - build-windows
      - build-android
      - build-ios
    permissions:
      contents: write
      discussions: write
    # 本 job 只用 gh CLI，不读仓库里的任何文件 —— 因此去掉 checkout，
    # 直接省掉一次 1.25GB 的工作树检出（gh 靠 GH_REPO 定位仓库）。
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          gh release edit "$TAG" \
          --draft=false \
          --discussion-category "Announcements"

  cleanup-release:
    name: Clean Draft When Failure
    if: ${{ failure() }}
    needs:
      - create-release
      - build-core
      - build-windows
      - build-android
      - build-ios
      - release
    runs-on: ubuntu-latest
    # 同上：只用 gh CLI，不需要检出仓库（只在这一步失败时才会跑到）。
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Delete draft release on failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes --cleanup-tag=false
