name: Lint Check

on:
  pull_request:
    branches: [main]

# 并发控制：同一 PR 连续推送时，旧运行已无意义，直接取消，省下 runner 时间。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESLint Check
            script: lint
          - name: Prettier Check
            script: lint:prettier
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # 本仓库被跟踪的内容共 1.25GB / 15576 个文件，其中仅 apps/core 的素材就占
          #   1.15GB（audio 621MB + image 531MB + theme 3MB）。
          #   lint 只需要源码，因此做「部分克隆 + 稀疏检出」：
          #     filter: blob:none  → 不下载未被检出的 blob（省掉那 1.15GB 的下载）
          #     sparse-checkout    → 只落地源码，不把那 1.4 万个素材文件写到磁盘
          #   默认包含全部、只排除三个纯素材目录 → 即使将来新增顶层目录也不会漏检。
          #   （非 cone 模式才支持 ! 否定模式，故 sparse-checkout-cone-mode: false。）
          filter: blob:none
          sparse-checkout: |
            /*
            !/apps/core/audio/
            !/apps/core/image/
            !/apps/core/theme/
          sparse-checkout-cone-mode: false

      - name: Fetch base branch (shallow)
        # 本步骤无需额外处理：blob:none 是写在 remote 配置里的，会被这次 fetch 继承，
        # 因此拉取 base 分支时也不会把素材 blob 拉下来。
        run: git fetch --no-tags --depth=1 origin ${{ github.base_ref }}:${{ github.base_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Run ${{ matrix.name }}
        run: pnpm --filter "...[${{ github.base_ref }}]" --filter "!./" run --if-present ${{ matrix.script }}
