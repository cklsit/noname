name: Build unsigned iOS IPA

# 用途：在没有 Mac（或 Mac 太老装不了新 Xcode）的情况下，用 GitHub 免费提供的
# macOS 云端机器把《无名杀》编译成未签名的 .ipa，再交给 SideStore / AltStore
# 用你自己的 Apple ID 重签安装。
#
# 为什么必须是「未签名」的 ipa：
#   CI 上没有你的开发者证书，xcodebuild 无法完成签名。但 SideStore 本来就会
#   用你自己的 Apple ID 重新签名，所以未签名的 ipa 正是它需要的输入格式。
#
# 触发方式：GitHub 网页 → Actions → “Build unsigned iOS IPA” → Run workflow
# 产物位置：运行页面底部的 Artifacts；同时会附到自动创建的 Release 上。

on:
  # 手动触发（推荐）
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Artifact 保留天数（1-90）"
        required: false
        default: "14"
      create_release:
        description: "是否把 ipa 同时发到 Release"
        type: boolean
        required: false
        default: true
      slim_assets:
        description: "资源瘦身：裁掉大体积可选资源（技能/阵亡语音、武将立绘），把 ipa 压到 300MB 以内以便侧载"
        type: boolean
        required: false
        default: true

  # 打 tag 时自动构建，方便发版
  push:
    tags:
      - "ios-v*"

permissions:
  contents: write # 创建 Release 需要

jobs:
  build-ipa:
    name: Build unsigned IPA
    # macos-15 自带 Xcode 16.x + CocoaPods 1.16，满足 Capacitor 6 的 Xcode 15+ 要求
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Show runner info and free disk
        run: |
          echo "===== Runner ====="
          uname -a
          sw_vers
          echo "===== Xcode ====="
          xcodebuild -version
          echo "===== CocoaPods ====="
          pod --version
          echo "===== Disk before checkout ====="
          df -h /

      - name: Checkout repository (shallow)
        uses: actions/checkout@v6
        with:
          # ⚠️ 极其关键：本仓库 Git 历史巨大（约 2.6TB），
          # 必须用 depth=1 只拉最新一个 commit，否则会耗尽 runner 磁盘。
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Disk after checkout
        run: df -h /

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts 跳过 electron 等无关平台重活，加快安装
        # --prefer-offline 优先命中 setup-node 恢复的 pnpm store（版本仍由 lockfile 锁定）
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Disk after install
        run: df -h /

      - name: Build web assets (dist/)
        env:
          NONAME_BUILD_CHANNEL: test
          NONAME_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm build

      - name: Disk after web build
        run: |
          df -h /
          du -sh dist

      # ⚠️ 位置很关键：必须在 `cap add ios` / `pnpm sync` 之前裁剪 dist。
      #   原先的顺序是「全量同步进 iOS 工程 → 再裁剪 dist 与已同步的那一份 → 再 cap copy 覆盖」，
      #   相当于先把约 955MB 用不到的语音与立绘拷进 ios/App/App/public，随后又删掉，
      #   还多跑一次 cap copy + 手工重建两份 asset-manifest.json。
      #   改成「先裁剪 dist 再同步」后：这些文件从未被拷贝；清单由紧随其后的 `pnpm sync`
      #   （afterSync.ts → apps/mobile/scripts/asset-manifest.ts）按裁剪后的 dist 自动生成。
      - name: Slim assets (optional)
        if: github.event_name == 'push' || inputs.slim_assets
        run: |
          # 侧载工具对未压缩 App 体积非常敏感：
          #   - AltStore 未打补丁时 >300MB 的 ipa 直接报 Bad Allocation
          #   - 即使打 4GB patch，Apple 侧未压缩 App 硬上限仍是 4GB
          # 本仓库全量资源约 2.8GB，不裁剪几乎必然装不上。
          #
          # 裁掉的资源体积最大、且缺失不影响可玩性（自动保留必需占位图）：
          #   audio/skill       457M  武将技能语音（全为 mp3，整目录删）
          #   audio/die         108M  阵亡语音（全为 mp3，整目录删）
          #   image/character   ~390M 武将立绘（保留 3 张 default_silhouette_*）
          TARGET=dist
          echo "===== 裁剪前 ====="
          du -sh "$TARGET"

          # 语音类可以整目录删除（目录内全是 mp3，无必需文件）
          rm -rf "$TARGET/audio/skill"
          rm -rf "$TARGET/audio/die"

          # 武将立绘目录里有 3 张游戏必需的默认剪影
          # （characterDefaultPicturePath = image/character/default_silhouette_），
          # 不能整个目录删掉，否则未提供立绘的武将会显示破图。
          # 做法：把必需的 3 张剪影先挪到临时区，删目录后再放回原位置。
          if [ -d "$TARGET/image/character" ]; then
            TMP_KEEP=$(mktemp -d)
            find "$TARGET/image/character" -maxdepth 1 -name 'default_silhouette_*' -exec cp {} "$TMP_KEEP/" \; 2>/dev/null || true
            KEPT=$(find "$TMP_KEEP" -maxdepth 1 -type f | wc -l | tr -d ' ')
            rm -rf "$TARGET/image/character"
            mkdir -p "$TARGET/image/character"
            cp "$TMP_KEEP"/default_silhouette_* "$TARGET/image/character/" 2>/dev/null || true
            rm -rf "$TMP_KEEP"
            if [ "$KEPT" -eq 0 ]; then
              echo "::error::未找到 default_silhouette_* 必需剪影，已中止（避免产物缺图）"
              exit 1
            fi
            echo "image/character 已裁剪（保留 $KEPT 张必需剪影）"
          fi

          echo "===== 裁剪后 ====="
          du -sh "$TARGET"
          du -sh "$TARGET"/* | sort -rh | head -10
          # 清单不在这里重建：紧随其后的 `pnpm sync` 会按裁剪后的 dist 生成清单，
          # 并随 cap sync 一起同步进 iOS 工程（唯一实现见 apps/mobile/scripts/asset-manifest.ts）。

      - name: Generate iOS Capacitor project
        working-directory: apps/mobile
        # Capacitor 6 用 CocoaPods 管理 iOS 依赖，因此显式指定 packagemanager。
        env:
          CI: "true"
        run: npx cap add ios --packagemanager CocoaPods

      - name: Capacitor sync (builds preload.js)
        working-directory: apps/mobile
        # afterSync.ts 内部顺序：buildPreload() → writeAssetManifest() → capSync()
        # 这一步把 preload.js 与（已裁剪的）dist 同步进 ios/App/App/public，
        # 并顺带生成 asset-manifest.json —— 因此不再需要额外的 cap copy 与手工重建清单。
        run: pnpm sync

      # Capacitor 6 默认生成 apps/mobile/ios/App/App.xcworkspace（含 Pods）。
      # 注意：App.xcodeproj 内部还有一个 project.xcworkspace，它不包含 Pods，
      # 用它构建会报 `no such module 'Capacitor'`。所以必须显式排除 xcodeproj 内部
      # 的那个，只取与 .xcodeproj 同级、且名字与 xcodeproj 同名的 workspace。
      - name: Locate iOS workspace
        id: ios
        working-directory: apps/mobile/ios
        run: |
          echo "===== ios 目录结构 ====="
          find . -maxdepth 3 \( -name "*.xcworkspace" -o -name "*.xcodeproj" -o -name "Podfile" \) | sort

          # 先尝试标准路径（Capacitor 默认布局）
          WS=""
          for CAND in App/App.xcworkspace App.xcworkspace; do
            if [ -d "$CAND" ]; then WS="$CAND"; break; fi
          done

          # 兜底：找与 *.xcodeproj 同级的同名 workspace，并排除 xcodeproj 内部的
          if [ -z "$WS" ]; then
            WS=$(find . -maxdepth 3 -type d -name "*.xcworkspace" \
                   ! -path "*.xcodeproj/*" | head -n1)
          fi

          if [ -z "$WS" ]; then
            echo "::error::找不到 .xcworkspace（已排除 xcodeproj 内部的那个）"
            find . -maxdepth 4 -type d || true
            exit 1
          fi

          # 归一化去掉开头的 ./ ，避免拼出 apps/mobile/ios/./App 这类路径
          PROJ_DIR=$(dirname "$WS")
          PROJ_DIR=${PROJ_DIR#./}
          echo "workspace=$(basename "$WS")" >> "$GITHUB_OUTPUT"
          echo "app_dir=$PROJ_DIR" >> "$GITHUB_OUTPUT"
          echo "Found workspace: $WS (dir: $PROJ_DIR)"

          # 安全校验：确保 workspace 目录里确实有 Podfile（即确实由 CocoaPods 管理）
          if [ ! -f "$PROJ_DIR/Podfile" ]; then
            echo "::error::$PROJ_DIR 下没有 Podfile，说明选错了 workspace，或 pod 未初始化。"
            ls -la "$PROJ_DIR"
            exit 1
          fi
          echo "Podfile found in $PROJ_DIR ✓"

      - name: Cache CocoaPods
        # macOS runner 每次都是干净环境；不缓存的话每次 pod install 都要重新拉规格索引。
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/**/Podfile', 'apps/mobile/pnpm-lock.yaml') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios/${{ steps.ios.outputs.app_dir }}
        # 去掉 --repo-update：Capacitor 6 的 pod 全部是本地 :path 引用
        # （Podfile 指向 node_modules/@capacitor/ios 等），无需更新远端规格仓库；
        # 而 --repo-update 会强制刷新 CocoaPods 规格库，是本步骤里最慢的一段。
        run: pod install

      - name: Show workspace and scheme
        working-directory: apps/mobile/ios/${{ steps.ios.outputs.app_dir }}
        run: |
          ls -la
          xcodebuild -list -workspace "${{ steps.ios.outputs.workspace }}"

      - name: Build unsigned archive
        working-directory: apps/mobile/ios/${{ steps.ios.outputs.app_dir }}
        run: |
          set -o pipefail

          # 提前体检：若可用空间不足 5GB，直接给出明确结论，
          # 避免 xcodebuild 在磁盘写满时抛出难以排查的报错。
          AVAIL_KB=$(df -k / | awk 'NR==2 {print $4}')
          AVAIL_GB=$((AVAIL_KB / 1024 / 1024))
          echo "Available disk: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -lt 5 ]; then
            echo "::error::磁盘不足（仅剩 ${AVAIL_GB} GB）。本仓库 Git 历史过大，请参考 workflow 顶部注释。"
            du -sh . 2>/dev/null || true
            exit 1
          fi

          # CODE_SIGNING_ALLOWED=NO 是核心：没有证书也能编译出 .app
          xcodebuild \
            -workspace "${{ steps.ios.outputs.workspace }}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package unsigned IPA
        id: package
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found. Build output:"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 || true
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"

          IPA_NAME="noname-ios-unsigned"
          BUILD_DIR="$RUNNER_TEMP/ipa-build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/Payload"
          cp -r "$APP_PATH" "$BUILD_DIR/Payload/"

          # 顺手剥掉 macOS 的扩展属性文件，减小体积
          find "$BUILD_DIR/Payload" -name "._*" -delete || true

          cd "$BUILD_DIR"
          zip -qry "$IPA_NAME.ipa" Payload

          echo "IPA size:"
          du -h "$IPA_NAME.ipa"
          ls -lh "$IPA_NAME.ipa"

          echo "ipa_path=$BUILD_DIR/$IPA_NAME.ipa" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: noname-ios-unsigned
          path: ${{ steps.package.outputs.ipa_path }}
          # workflow_dispatch 时用用户填的天数；tag 触发时 inputs 为空，回退到 14 天
          retention-days: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.retention_days) || 14 }}
          if-no-files-found: error

      - name: Publish to Release
        if: github.event_name == 'push' || inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          # tag 触发时用 tag 名做 Release 标签，手动触发时按运行序号生成
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            TITLE="iOS unsigned ${{ github.ref_name }}"
          else
            TAG="ios-build-${{ github.run_number }}"
            TITLE="iOS unsigned build #${{ github.run_number }}"
          fi
          echo "Release tag: $TAG"

          # 标签已存在就复用，否则新建
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading asset only."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes "未签名 iOS ipa（GitHub Actions 自动构建，commit ${{ github.sha }}）。

          **安装方式**：把这个 .ipa 导入 SideStore / AltStore，用你自己的 Apple ID 重签后安装。

          ⚠️ 未签名包无法直接安装，必须经过侧载工具重签。免费 Apple ID 签名的应用 7 天后过期，需要重新刷新。"
          fi

          gh release upload "$TAG" "$IPA_PATH" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Summary
        env:
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
        run: |
          IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
          {
            echo "## iOS 未签名 IPA 构建完成 ✅"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 产物 | \`noname-ios-unsigned.ipa\` |"
            echo "| 大小 | ${IPA_SIZE} |"
            echo "| 签名 | 未签名（需 SideStore/AltStore 重签） |"
            echo "| Xcode | $(xcodebuild -version | head -n1) |"
            echo ""
            echo "下载：本页底部 **Artifacts**，或 [Releases](https://github.com/$GITHUB_REPOSITORY/releases)。"
            echo ""
            echo "> 装到 iPhone 的步骤见[《无名杀 iOS 操作手册》](https://github.com/cklsit/noname/blob/main/%E6%97%A0%E5%90%8D%E6%9D%80iOS%E6%93%8D%E4%BD%9C%E6%89%8B%E5%86%8C.md)。"
          } >> "$GITHUB_STEP_SUMMARY"
